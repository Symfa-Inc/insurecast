<template>
  <style>
    @font-face { font-family: "Geist"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/Geist-latin.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Geist", sans-serif; -webkit-font-smoothing: antialiased; }
    #root h1, #root h2, #root p { margin: 0; padding: 0; }
    #sw-sheet { position: absolute; inset: 0; background: #fafafa; }
    #sw-line { position: absolute; left: -2px; width: 1920px; top: 483px; text-align: center; /* centred: ink box measured in REVIEW.md */ font-size: 112px; line-height: 1.02; font-weight: 600; letter-spacing: -0.035em; color: #18181b; white-space: nowrap; display: flex; align-items: baseline; justify-content: center; }
    .sw-w { display: inline-block; color: #e4e4e7; margin-right: 0.24em; }
    #sw-slot { position: relative; display: inline-block; height: 1.02em; overflow: hidden; color: #e4e4e7; font-variant-numeric: tabular-nums; }
    #sw-reel { display: flex; flex-direction: column; }
    #sw-reel span { height: 1.02em; display: block; text-align: left; /* keep the gap after "rise" constant while the reel rolls */ }
    #sw-q { display: inline-block; color: #e4e4e7; }
  </style>
  <div id="root" data-composition-id="sheet-whatif" data-width="1920" data-height="1080">
    <div id="sw-sheet">
      <h2 id="sw-line" data-layout-allow-overlap data-layout-allow-occlusion><span class="sw-w">What</span><span class="sw-w">if</span><span class="sw-w">costs</span><span class="sw-w">rise</span><span id="sw-slot"><span id="sw-reel"><span>2%</span><span>5%</span><span>10%</span></span></span><span id="sw-q">?</span></h2>
    </div>
  </div>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#sw-sheet", { x: 2050, filter: "blur(10px)" }, { x: 0, duration: 0.45, ease: "power3.inOut" }, 0);
      tl.to("#sw-sheet", { filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0.25);
      // ghost -> ink, as the Read card; the whole line, reel included, is ghost type from frame 0
      var w = document.querySelectorAll("#sw-line .sw-w");
      for (var i = 0; i < w.length; i++) {
        tl.fromTo(w[i], { color: "#e4e4e7" }, { color: "#18181b", duration: 0.2, ease: "power1.out" }, 0.4 + i * 0.09);
      }
      // the reel inks to the accent with "rise", then rolls 2% -> 5% -> 10% exactly as before
      tl.fromTo("#sw-slot", { color: "#e4e4e7" }, { color: "#2563eb", duration: 0.2, ease: "power1.out" }, 0.4 + 3 * 0.09);
      tl.fromTo("#sw-reel", { yPercent: 0 }, { yPercent: -33.333, duration: 0.14, ease: "power2.inOut" }, 0.76);
      tl.to("#sw-reel", { yPercent: -66.667, duration: 0.2, ease: "power3.out" }, 0.9);
      tl.fromTo("#sw-q", { color: "#e4e4e7" }, { color: "#18181b", duration: 0.2, ease: "power1.out" }, 0.4 + 5 * 0.09);
      // the reel box is sized for "10%": while it shows 2% / 5% the "?" sits 65 px in (one tabular digit, measured on
      // the rendered frame), then rides out with the last roll so the ghost line never shows a hole before the "?"
      gsap.set("#sw-q", { x: -65, force3D: false });
      tl.fromTo("#sw-q", { x: -65 }, { x: 0, duration: 0.2, ease: "power3.out", force3D: false }, 0.9);
      tl.to("#sw-sheet", { x: -2050, duration: 0.45, ease: "power3.inOut" }, 1.95);
      tl.to("#sw-sheet", { filter: "blur(10px)", duration: 0.22, ease: "power2.in" }, 1.95);
      window.__timelines["sheet-whatif"] = tl;
    })();
  </script>
</template>
