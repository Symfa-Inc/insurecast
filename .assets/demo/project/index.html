<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"color-ground","type":"color","label":"Background","default":"#fafafa"},
  {"id":"color-ink","type":"color","label":"Text","default":"#18181b"},
  {"id":"color-accent","type":"color","label":"Accent","default":"#2563eb"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>InsureCast product demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fafafa; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #ground { position: absolute; inset: 0; background: #fafafa; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="62.5" data-width="1920" data-height="1080">
      <div id="ground"></div>
      <!-- the product, one continuous take -->
      <div id="app" data-composition-id="app" data-composition-src="compositions/app.html" data-start="5.9" data-duration="50" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:1"></div>
      <!-- hook poster + chapter 1 line, leaves as a sheet -->
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="6.45" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:5"></div>
      <!-- chapter sheets -->

      <!-- end card, held while the music resolves -->
